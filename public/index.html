<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>London Titans Fixtures V2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="app" id="app">
      <header class="header">
        <img class="clubMark" src="./ltfc-crest.png" alt="London Titans FC crest" />
        <div class="headerCopy">
          <p class="eyebrow">London Titans FC</p>
          <h1>Fixtures Centre</h1>
          <p class="intro">
            Once a Titan, always a Titan. Follow every side across upcoming matches,
            recent results, and the full fixture list.
          </p>
        </div>
        <div id="status" role="status">Loading...</div>
      </header>

      <section class="controls" aria-label="Fixture controls">
        <nav class="tabs" aria-label="Fixture view">
          <button class="tab isActive" data-view="upcoming">Upcoming</button>
          <button class="tab" data-view="results">Results</button>
          <button class="tab" data-view="all">All</button>
        </nav>

        <nav class="teamFilters" aria-label="Team filter">
          <button class="teamFilter isActive" type="button" data-team="all">All Teams</button>
        </nav>

        <div class="filterGrid">
          <label class="field">
            <span>Search</span>
            <input id="fixtureSearch" type="search" placeholder="Team, opponent, league, venue" autocomplete="off" />
          </label>

          <label class="field">
            <span>Competition</span>
            <select id="competitionFilter">
              <option value="all">All competitions</option>
            </select>
          </label>

          <label class="field">
            <span>Season</span>
            <select id="seasonFilter">
              <option value="all">All seasons</option>
            </select>
          </label>

          <label class="field">
            <span>Status</span>
            <select id="statusFilter">
              <option value="all">All statuses</option>
              <option value="upcoming">Upcoming</option>
              <option value="played">Played</option>
              <option value="postponed">Postponed</option>
              <option value="cancelled">Cancelled</option>
              <option value="tbc">TBC</option>
            </select>
          </label>

          <button class="clearFilters" id="clearFilters" type="button">Reset filters</button>
        </div>
      </section>

      <section class="summaryGrid" id="summaryGrid" aria-label="Fixture summary"></section>
      
      <section id="hero"></section>

      <section class="fixtureList">
        <div class="listHeader">
          <p class="eyebrow">Match Centre</p>
          <h2 id="listTitle">Upcoming Fixtures</h2>
          <span id="fixtureCount">0 matches</span>
        </div>

        <div id="output"></div>
      </section>
    </main>

    <div class="modalOverlay" id="fixtureModal" hidden>
      <div class="modalDialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modalClose" type="button" aria-label="Close match details">X</button>
        <div id="modalContent"></div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
