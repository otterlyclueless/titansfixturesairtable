<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>London Titans Member Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body data-default-view="events" data-audience="members">
    <main class="app isEventsApp" id="app">
      <header class="header header--events">
        <img class="clubMark" src="./ltfc-crest.png" alt="London Titans FC crest" />
        <div class="headerCopy">
          <p class="eyebrow">London Titans FC</p>
          <h1>Member Events</h1>
          <p class="intro">
            Private and public club events, socials, training sessions, and tournaments for members.
          </p>
        </div>
        <div id="status" role="status" aria-live="polite">Loading...</div>
      </header>

      <section class="summaryGrid" id="summaryGrid" aria-label="Member event summary"></section>

      <section id="hero"></section>

      <section class="fixtureList fixtureList--events">
        <div class="listHeader">
          <p class="eyebrow">Member Calendar</p>
          <h2 id="listTitle">Member Events</h2>
          <span id="fixtureCount">0 events</span>
        </div>

        <div id="output"></div>
      </section>
    </main>

    <div class="modalOverlay" id="fixtureModal" hidden>
      <div class="modalDialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modalClose" type="button" aria-label="Close event details">X</button>
        <div id="modalContent"></div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
